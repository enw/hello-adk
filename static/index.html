<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>hello-adk chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<style>
  :root {
    --bg: #0b0e14; --panel: #10141c; --panel2: #161b25; --line: #1d232e;
    --fg: #c9d3e0; --dim: #6b7686; --accent: #6ca0ff; --ok: #7ee787;
    --warn: #e3b341; --err: #ff7b72;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail-w: 232px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
    display: grid;
    grid-template-columns: var(--rail-w) 1fr;
    grid-template-rows: minmax(0, 1fr) 28px;
    grid-template-areas: "rail main" "status status";
  }
  body.rail-off { --rail-w: 0; }
  body.rail-off #rail { display: none; }

  #rail { grid-area: rail; background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  #rail-head { display: flex; justify-content: space-between; align-items: center;
               padding: 7px 8px; border-bottom: 1px solid var(--line); }
  #rail-title { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  #rail-count { color: var(--dim); font-size: 10px; margin-left: 6px; }
  #new { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
         border-radius: 5px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 11px; }
  #new:hover { border-color: var(--accent); color: var(--accent); }
  #sessions { flex: 1; overflow-y: auto; padding: 4px 0; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 6px;
          padding: 4px 8px 4px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .srow:hover { background: var(--panel2); }
  .srow.on { border-left-color: var(--accent); background: var(--panel2); }
  .sid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sid.dim { color: var(--dim); }
  .sright { display: flex; gap: 4px; align-items: center; color: var(--dim); font-size: 10px; }
  .sdel { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit;
          padding: 0 3px; line-height: 1; }
  .sdel:hover { color: var(--err); }

  #main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; }
  #empty { color: var(--dim); padding: 8px 48px; }
  .msg { display: flex; gap: 10px; padding: 3px 0; align-items: baseline; }
  .msg .who { flex: none; width: 34px; color: var(--dim); font-size: 10px; text-align: right; }
  .msg.user .who { color: var(--accent); }
  .msg .body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .body p { margin: 0 0 6px; }
  .msg .body p:last-child { margin: 0; }
  .msg .body code { background: var(--panel2); border: 1px solid var(--line);
                    border-radius: 3px; padding: 0 4px; }
  .msg .body pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
                   padding: 8px; overflow-x: auto; margin: 4px 0; }
  .msg .body pre code { border: 0; padding: 0; background: none; }
  .msg .body a { color: var(--accent); }
  .msg.err .body { color: var(--err); }
  .toolrow { padding: 2px 0 2px 44px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line);
          background: var(--panel2); border-radius: 10px; padding: 1px 9px; font-size: 11px;
          cursor: pointer; user-select: none; }
  .chip.call { color: var(--warn); }
  .chip.result { color: var(--ok); }
  .chip .arrow::before { content: "▸"; color: var(--dim); }
  .toolrow.open .chip .arrow::before { content: "▾"; }
  .toolpre { display: none; margin: 3px 0; white-space: pre-wrap; overflow-wrap: anywhere;
             color: var(--dim); font-size: 11px; }
  .toolrow.open .toolpre { display: block; }

  #composer { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line);
              background: var(--panel); }
  #input { flex: 1; resize: none; background: var(--bg); color: var(--fg);
           border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
           font: inherit; max-height: 40vh; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
          border-radius: 6px; padding: 0 14px; cursor: pointer; font: inherit; }
  #send:hover { border-color: var(--accent); color: var(--accent); }

  #status { grid-area: status; display: flex; gap: 10px; align-items: center; padding: 0 10px;
            background: var(--panel); border-top: 1px solid var(--line); font-size: 10px;
            color: var(--dim); white-space: nowrap; overflow: hidden; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.live { background: var(--warn); animation: pulse 1s infinite; }
  #dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }
  #st-model { color: var(--fg); }
  #st-hint { margin-left: auto; text-align: right; }
  #railbtn { display: none; background: none; border: 0; color: var(--dim); cursor: pointer;
             font: inherit; padding: 0 4px; }

  #lock { position: fixed; inset: 0; background: rgba(5, 8, 12, .92); z-index: 50;
          display: flex; align-items: center; justify-content: center; }
  #lock[hidden] { display: none; }
  #lockcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              padding: 20px; width: min(380px, 92vw); }
  #lockcard h1 { margin: 0 0 8px; font-size: 14px; }
  #lockcard p { color: var(--dim); font-size: 11px; margin: 0 0 12px; }
  #lockcard input { width: 100%; background: var(--bg); color: var(--fg);
                    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
                    font: inherit; outline: none; margin-bottom: 10px; }
  #lockcard input:focus { border-color: var(--accent); }
  #lockcard button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
                     border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-areas: "main" "status"; }
    #rail { position: fixed; left: 0; top: 0; bottom: 28px; width: min(280px, 84vw); z-index: 10;
            transform: translateX(-101%); transition: transform .15s ease; }
    body.rail-open #rail { transform: none; }
    body.rail-off #rail { display: flex; }
    #railbtn { display: inline; }
    #st-hint { display: none; }
    .toolrow { padding-left: 0; }
    .msg .who { width: 28px; }
  }
</style>
</head>
<body>
<div id="lock" hidden>
  <form id="lockcard">
    <h1>hello-adk chat</h1>
    <p>Token-gated. Open with <code>?token=…</code> in the URL, or paste the token once — it is kept on this device only.</p>
    <input id="lockinput" type="password" autocomplete="current-password" placeholder="token" autofocus>
    <button type="submit">unlock</button>
  </form>
</div>
<aside id="rail">
  <div id="rail-head">
    <span><span id="rail-title">sessions</span><span id="rail-count"></span></span>
    <button id="new" title="New session (⌘K)">+ new</button>
  </div>
  <div id="sessions"></div>
</aside>
<main id="main">
  <div id="log"><div id="empty">no messages — say something</div></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message · Enter sends · Shift+Enter newline · Esc stops"></textarea>
    <button id="send" type="submit">send</button>
  </form>
</main>
<footer id="status">
  <span id="dot"></span><span id="st-state">booting</span>
  <span id="st-session"></span>
  <span id="st-model"></span>
  <button id="railbtn" title="Sessions">☰</button>
  <span id="st-hint">⌘K new · ⌘B rail · Esc stop</span>
</footer>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input");
  const TOKEN_KEY = "chatToken", LAST_KEY = "lastSession";

  const state = { token: "", model: "", sessions: [], current: null,
                  ctrl: null, streaming: false, active: null, lastSent: "" };

  // Token from the URL wins; strip it so it never leaks into copied links.
  {
    const q = new URLSearchParams(location.search);
    const t = q.get("token");
    if (t) {
      localStorage.setItem(TOKEN_KEY, t);
      q.delete("token");
      history.replaceState(null, "", q.toString() ? `?${q}` : location.pathname);
    }
  }
  state.token = localStorage.getItem(TOKEN_KEY) || "";

  function esc(s) { const e = document.createElement("span"); e.textContent = s; return e.innerHTML; }

  function md(text) {
    if (window.marked && window.DOMPurify) {
      if (!md.configured) { marked.setOptions({ breaks: true, gfm: true }); md.configured = true; }
      return DOMPurify.sanitize(marked.parse(text));
    }
    return esc(text); // plain-text fallback when the CDN is unreachable
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: {
      "x-chat-token": state.token,
      ...(opts.body ? { "content-type": "application/json" } : {}),
      ...(opts.headers || {}),
    }});
    if (res.status === 401) { lock(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    return res;
  }

  function lock() { $("lock").hidden = false; input.blur(); }

  $("lockcard").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("lockinput").value.trim();
    if (!v) return;
    localStorage.setItem(TOKEN_KEY, v);
    location.reload();
  });

  // ---- rendering ----------------------------------------------------------

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 60; }
  function auto(mutate) { const stick = nearBottom(); mutate(); if (stick) log.scrollTop = log.scrollHeight; }
  function clearEmpty() { const e = $("empty"); if (e) e.remove(); }

  function addText(author, html, cls) {
    clearEmpty();
    const row = el("div", `msg ${cls || (author === "user" ? "user" : "model")}`);
    row.append(el("span", "who", author === "user" ? "you" : "adk"));
    const body = el("div", "body");
    body.innerHTML = html;
    row.append(body);
    log.append(row);
    return body;
  }

  const openTools = new Map(); // tool name -> queue of chips awaiting their result

  function chipRow(chip, pre) {
    const row = el("div", "toolrow");
    chip.addEventListener("click", () => row.classList.toggle("open"));
    row.append(chip, pre);
    log.append(row);
    return row;
  }

  function addToolCall(name, args) {
    clearEmpty();
    const chip = el("span", "chip call");
    const label = el("span", null, `⚙ ${name}`);
    chip.append(el("span", "arrow"), label);
    const pre = el("pre", "toolpre", `args\n${JSON.stringify(args, null, 2)}`);
    chipRow(chip, pre);
    const queue = openTools.get(name) || [];
    queue.push({ chip, label, pre });
    openTools.set(name, queue);
  }

  function addToolResult(name, response) {
    const queue = openTools.get(name);
    const pending = queue && queue.length ? queue.shift() : null;
    if (!pending) { // unpaired result (e.g. history missing its call): standalone
      clearEmpty();
      const chip = el("span", "chip result");
      chip.append(el("span", "arrow"), el("span", null, `✓ ${name}`));
      chipRow(chip, el("pre", "toolpre", `result\n${JSON.stringify(response, null, 2)}`));
      return;
    }
    pending.pre.textContent += `\nresult\n${JSON.stringify(response, null, 2)}`;
    pending.chip.className = "chip result";
    pending.label.textContent = `✓ ${name}`;
  }

  function addError(message) {
    clearEmpty();
    const body = addText("model", esc(String(message)), "err");
    return body;
  }

  function activeBody() {
    if (!state.active) state.active = addText("model", "");
    return state.active;
  }
  function finalizeActive() {
    if (state.active) { state.active.innerHTML = md(state.active.textContent); state.active = null; }
  }

  function setStatus(mode, label) {
    $("dot").className = mode === "live" ? "live" : mode === "err" ? "err" : "";
    $("st-state").textContent = label || (mode === "live" ? "streaming" : mode === "err" ? "error" : "idle");
  }

  function onEvent(ev) {
    if (ev.type === "delta") auto(() => { activeBody().textContent += ev.text; });
    else if (ev.type === "replace") auto(() => { const b = activeBody(); b.innerHTML = md(ev.text); state.active = null; });
    else if (ev.type === "tool") auto(() => (ev.phase === "call" ? addToolCall(ev.name, ev.args) : addToolResult(ev.name, ev.response)));
    else if (ev.type === "error") { finalizeActive(); auto(() => addError(ev.message)); setStatus("err"); }
    else if (ev.type === "done") { finalizeActive(); setStatus("idle"); }
  }

  // ---- sessions -----------------------------------------------------------

  function timeAgo(ms) {
    if (!ms) return "";
    const s = Math.max(1, Math.floor((Date.now() - ms) / 1000));
    for (const [u, n] of [["y", 31536000], ["d", 86400], ["h", 3600], ["m", 60]])
      if (s >= n) return Math.floor(s / n) + u;
    return s + "s";
  }

  function renderRail() {
    const box = $("sessions");
    box.textContent = "";
    state.sessions.sort((a, b) => (b.updated || 0) - (a.updated || 0));
    for (const s of state.sessions) {
      const row = el("div", "srow" + (s.id === state.current ? " on" : ""));
      row.append(el("span", "sid" + (s.title ? "" : " dim"), s.title || "untitled"));
      const right = el("span", "sright");
      right.append(el("span", "stime", timeAgo(s.updated)));
      const del = el("button", "sdel", "×");
      del.title = "delete session";
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
      right.append(del);
      row.append(right);
      row.addEventListener("click", () => selectSession(s.id));
      box.append(row);
    }
    $("rail-count").textContent = state.sessions.length ? String(state.sessions.length) : "";
  }

  async function loadSessions() {
    const data = await (await api("/api/sessions")).json();
    state.sessions = data.sessions;
    renderRail();
  }

  async function newSession() {
    const s = await (await api("/api/sessions", { method: "POST" })).json();
    state.sessions.push(s);
    await selectSession(s.id);
  }

  async function deleteSession(id) {
    await api(`/api/sessions/${encodeURIComponent(id)}`, { method: "DELETE" });
    state.sessions = state.sessions.filter((s) => s.id !== id);
    if (state.current === id) {
      state.current = null;
      log.textContent = "";
      if (state.sessions[0]) await selectSession(state.sessions[0].id);
      else await newSession();
    } else renderRail();
  }

  async function selectSession(id) {
    state.current = id;
    localStorage.setItem(LAST_KEY, id);
    renderRail();
    $("st-session").textContent = id.slice(0, 8);
    log.textContent = "";
    openTools.clear();
    const data = await (await api(`/api/sessions/${encodeURIComponent(id)}/messages`)).json();
    auto(() => {
      for (const item of data.items) {
        if (item.kind === "text")
          addText(item.author, item.author === "user" ? esc(item.text) : md(item.text));
        else if (item.kind === "call") addToolCall(item.name, item.args);
        else addToolResult(item.name, item.response);
      }
    });
  }

  // ---- chat stream --------------------------------------------------------

  async function send() {
    const text = input.value.trim();
    if (!text || state.streaming) return;
    state.lastSent = text;
    if (!state.current) await newSession();
    input.value = "";
    autosize();
    setStatus("live");
    state.streaming = true;
    state.ctrl = new AbortController();
    auto(() => addText("user", esc(text)));
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        signal: state.ctrl.signal,
        headers: { "x-chat-token": state.token, "content-type": "application/json" },
        body: JSON.stringify({ session_id: state.current, text }),
      });
      if (res.status === 401) { lock(); return; }
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          const data = block.split("\n")
            .filter((l) => l.startsWith("data:"))
            .map((l) => l.slice(5).trim()).join("\n");
          if (data) onEvent(JSON.parse(data));
        }
      }
    } catch (err) {
      if (err.name === "AbortError") setStatus("idle", "stopped");
      else { auto(() => addError(err)); setStatus("err"); }
    } finally {
      state.streaming = false;
      state.ctrl = null;
      finalizeActive();
      loadSessions().catch(() => {});
    }
  }

  // ---- wiring -------------------------------------------------------------

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  }
  input.addEventListener("input", autosize);
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    else if (e.key === "Escape" && state.streaming) state.ctrl.abort();
    else if (e.key === "ArrowUp" && !input.value && state.lastSent) {
      e.preventDefault(); // recall the last sent message into an empty composer
      input.value = state.lastSent;
      autosize();
    }
  });
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); newSession().then(() => input.focus()); }
    else if (mod && e.key.toLowerCase() === "b") {
      e.preventDefault();
      document.body.classList.toggle("rail-off");
    }
  });
  $("new").addEventListener("click", () => newSession().then(() => input.focus()));
  $("railbtn").addEventListener("click", () => document.body.classList.toggle("rail-open"));

  (async function boot() {
    if (!state.token) { lock(); return; }
    try {
      const [st, sess] = await Promise.all([
        api("/api/state").then((r) => r.json()),
        api("/api/sessions").then((r) => r.json()),
      ]);
      state.model = st.model;
      $("st-model").textContent = st.model;
      state.sessions = sess.sessions;
      const last = localStorage.getItem(LAST_KEY);
      const target = state.sessions.find((s) => s.id === last) || state.sessions[0];
      if (target) await selectSession(target.id);
      else await newSession();
      setStatus("idle");
    } catch {
      setStatus("err", "offline");
    }
    input.focus();
    autosize();
  })();
})();
</script>
</body>
</html>
